<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nixodesu! Learn ganakana</title>
    <meta name="description" content="Master Hiragana and Katakana with beautiful flashcard quizzes.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <header class="app-header">
    <button class="logo-btn" onclick="location.reload()" aria-label="Nixodesu Home">
      <svg class="logo-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" rx="9" fill="currentColor" fill-opacity="0.12"/>
        <text x="50%" y="56%" font-size="20" text-anchor="middle" dominant-baseline="middle" font-family="serif" fill="currentColor">あ</text>
      </svg>
      <span class="logo-text">Nixodesu</span>
    </button>
    <nav class="header-nav">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <button class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Toggle Theme">
        <span id="theme-icon">🌙</span>
      </button>
    </nav>
  </header>

  <!-- SETUP VIEW -->
  <div id="setup-view" class="view active">
    <main class="setup-layout">
      <!-- SIDEBAR -->
      <aside class="sidebar glass-panel">
        <h2 class="sidebar-title">Game Mode</h2>
        <div class="mode-grid" id="mode-grid">
          <label class="mode-card" for="mode-mcq">
            <input type="checkbox" id="mode-mcq" name="game-mode" value="mcq" checked>
            <span class="mode-card-inner"><span class="mode-ico">a→■</span><span class="mode-lbl">Choose</span></span>
          </label>
          <label class="mode-card" for="mode-typing">
            <input type="checkbox" id="mode-typing" name="game-mode" value="typing">
            <span class="mode-card-inner"><span class="mode-ico">a✏</span><span class="mode-lbl">Type</span></span>
          </label>
          <label class="mode-card" for="mode-listen">
            <input type="checkbox" id="mode-listen" name="game-mode" value="listen">
            <span class="mode-card-inner"><span class="mode-ico">🎧■</span><span class="mode-lbl">Listen</span></span>
          </label>
          <label class="mode-card" for="mode-draw">
            <input type="checkbox" id="mode-draw" name="game-mode" value="draw">
            <span class="mode-card-inner"><span class="mode-ico">✏■</span><span class="mode-lbl">Draw</span></span>
          </label>
        </div>
        <p class="sidebar-hint">Multiple modes? App picks randomly each card!</p>

        <div class="sidebar-section">
          <h3 class="section-label">Order</h3>
          <div class="order-toggle">
            <button class="order-btn active" data-order="random" id="order-random-btn">Random</button>
            <button class="order-btn" data-order="focus" id="order-focus-btn">Focus</button>
          </div>
        </div>

        <div class="sidebar-section">
          <h3 class="section-label">Session Size</h3>
          <div class="size-control">
            <button class="size-adj-btn" id="size-dec">−</button>
            <input type="number" id="session-size" value="20" min="5" max="200">
            <button class="size-adj-btn" id="size-inc">+</button>
          </div>
        </div>

        <div class="sidebar-section">
          <label class="toggle-row" for="review-cb">
            <div class="toggle-text-wrap">
              <strong>Review Learning Cards</strong>
              <small>Preview kana before testing</small>
            </div>
            <div class="ios-toggle"><input type="checkbox" id="review-cb"><span class="knob"></span></div>
          </label>
        </div>

        <div class="sidebar-bottom">
          <div class="stats-chips">
            <div class="stat-chip"><span class="stat-val" id="streak-val">0</span><small>Streak</small></div>
            <div class="stat-chip"><span class="stat-val" id="score-val">0</span><small>Correct</small></div>
          </div>
          <button class="primary-btn" id="start-btn" disabled>Start Practice</button>
          <p class="start-hint" id="start-hint">Select kana groups to begin</p>
        </div>
      </aside>

      <!-- RIGHT AREA -->
      <section class="kana-selector">
        <div class="type-bar">
          <div class="type-segmented">
            <input type="radio" id="seg-hiragana" name="kana-type" value="hiragana" checked>
            <label for="seg-hiragana">ひらがな Hiragana</label>
            <input type="radio" id="seg-katakana" name="kana-type" value="katakana">
            <label for="seg-katakana">カタカナ Katakana</label>
          </div>
          <button class="ghost-btn" id="select-all-btn">Select All</button>
        </div>
        <div class="kana-columns" id="kana-columns"><!-- JS fills --></div>
      </section>
    </main>
  </div>

  <!-- REVIEW VIEW -->
  <div id="review-view" class="view">
    <header class="quiz-header">
      <button class="text-btn" id="review-skip-btn">Skip Review</button>
      <span class="progress-text"><span id="review-cur">1</span>/<span id="review-tot">1</span></span>
    </header>
    <main class="quiz-main">
      <div class="review-card glass-panel">
        <div class="review-kana" id="review-kana-el"></div>
        <div class="review-romaji" id="review-romaji-el"></div>
      </div>
      <button class="primary-btn" id="review-next-btn" style="max-width:320px;margin-top:28px;">Next →</button>
    </main>
  </div>

  <!-- QUIZ VIEW -->
  <div id="quiz-view" class="view">
    <div class="progress-track"><div id="progress-bar"></div></div>
    <header class="quiz-header">
      <div class="quiz-meta">
        <span class="mode-badge" id="session-mode-badge">Choose</span>
        <span class="progress-text" id="session-progress-text">0/0</span>
      </div>
      <button class="text-btn danger" id="end-session-btn">End Session</button>
    </header>

    <main class="quiz-main">
      <!-- MCQ Panel -->
      <div id="quiz-mcq" class="quiz-panel hidden">
        <div class="flashcard glass-panel" id="fc-mcq"><span id="kana-mcq"></span></div>
        <div class="options-grid" id="mcq-options"></div>
      </div>

      <!-- Typing Panel -->
      <div id="quiz-typing" class="quiz-panel hidden">
        <div class="flashcard glass-panel" id="fc-typing"><span id="kana-typing"></span></div>
        <div class="typing-zone">
          <input type="text" id="romaji-input" placeholder="Type romaji…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <button class="submit-btn" id="typing-submit-btn">↵</button>
        </div>
      </div>

      <!-- Listen Panel -->
      <div id="quiz-listen" class="quiz-panel hidden">
        <div class="flashcard glass-panel listen-card" id="fc-listen">
          <div class="listen-glyph">🔊</div>
          <div class="listen-hint">Listen &amp; choose</div>
        </div>
        <button class="ghost-btn" id="replay-btn" style="margin-bottom:16px;">🔁 Replay</button>
        <div class="options-grid" id="listen-options"></div>
      </div>

      <!-- Draw Panel -->
      <div id="quiz-draw" class="quiz-panel hidden">
        <p class="draw-prompt">Draw: <span class="draw-target" id="draw-romaji-target"></span></p>
        <div class="canvas-wrap glass-panel">
          <canvas id="draw-canvas" width="300" height="300"></canvas>
        </div>
        <div class="draw-controls">
          <button class="ghost-btn" id="clear-canvas-btn">✕ Clear</button>
          <button class="primary-btn" id="reveal-answer-btn" style="max-width:160px;">Reveal</button>
        </div>
        <div class="draw-reveal hidden" id="draw-reveal">
          <span class="draw-reveal-kana" id="draw-reveal-kana"></span>
          <div class="assess-row">
            <button class="assess-btn got-it" id="draw-correct-btn">✓ Got it</button>
            <button class="assess-btn missed" id="draw-wrong-btn">✗ Missed</button>
          </div>
        </div>
      </div>

      <button class="ghost-btn hidden" id="global-hint-btn" style="margin-top:16px; max-width:140px;">💡 Hint</button>

      <div class="feedback-toast hidden" id="feedback-toast"></div>
    </main>
  </div>

</div>
<script src="js/app.js"></script>
</body>
</html>
