<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nixodesu - Premium Kana Learning</title>
    <link rel="icon" href="assets/nixodesu-logo.png">
    <link rel="apple-touch-icon" href="assets/nixodesu-logo.png">
    <link rel="stylesheet" href="/nixodesu/css/variables.css">
    <link rel="stylesheet" href="/nixodesu/css/style.css">
    <link rel="stylesheet" href="/nixodesu/css/common.css">
    <link rel="stylesheet" href="/nixodesu/css/auth.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="/nixodesu/js/theme.js"></script>
    <script src="/nixodesu/js/cursor.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/nixodesu/js/supabase.js"></script>
    <link rel="stylesheet" href="/nixodesu/css/landing.css">
</head>
<body class="landing-page">

    <!-- Loading Animation -->
    <div class="loader-overlay" id="loader">
        <div class="loader-logo-wrap">
            <div class="loader-ring"></div>
            <img src="assets/nixodesu-logo.png" alt="Nixodesu Logo">
        </div>
        <div class="loader-text">Nixodesu</div>
    </div>

    <!-- Auth Header Controls -->
    <div class="auth-header-controls">
        <div class="auth-user-display" id="auth-user-display">Guest</div>
        <button class="auth-header-btn" id="auth-logout-btn" style="display:none; color: var(--red); border-color: rgba(255,59,63,0.3);">Log Out</button>
        <button class="auth-header-btn" id="auth-open-btn">Sign In</button>
    </div>

    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>
    
    <button class="landing-theme-toggle" id="theme-btn" aria-label="Toggle Theme">
        <svg class="theme-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>

    <!-- Main Content -->
    <div class="landing-container">
        <div class="hero-logo-box">
            <img src="assets/nixodesu-logo.png" alt="Nixodesu Logo">
        </div>
        <div>
            <h1 class="landing-title">Nixodesu</h1>
            <p class="landing-subtitle">Master Hiragana and Katakana through an elegant, distraction-free learning experience.</p>
        </div>

        <div class="landing-actions">
            <button class="btn-large btn-dash" onclick="location.href='/nixodesu/dashboard.html'">
                Dashboard
            </button>
            <button class="btn-large btn-start" onclick="location.href='/nixodesu/practice.html'">
                Start Practice →
            </button>
        </div>
    </div>

    <!-- Auth Modal -->
    <div class="auth-modal-overlay hidden" id="auth-modal">
        <div class="auth-modal">
            <button class="auth-close" id="auth-close-btn">&times;</button>
            <h2 id="auth-title">Welcome Back</h2>
            <form id="auth-form">
                <div class="auth-input-group">
                    <label>Email Address</label>
                    <input type="email" id="auth-email" class="auth-input" placeholder="you@example.com" required>
                </div>
                <div class="auth-input-group">
                    <label>Password</label>
                    <input type="password" id="auth-password" class="auth-input" placeholder="••••••••" required minlength="6">
                </div>
                <div class="auth-input-group" id="auth-phone-wrap" style="display:none;">
                    <label>Phone Number (Optional)</label>
                    <input type="tel" id="auth-phone" class="auth-input" placeholder="+1234567890">
                </div>
                <button type="submit" class="auth-submit-btn" id="auth-submit-btn">Log In</button>
            </form>
            <div class="auth-toggle-text" id="auth-toggle-mode">Don't have an account? Sign up</div>
        </div>
    </div>

    <footer class="global-footer">
        <div class="developer-credit">Nixodesu · Part of the Nix Suite by heyitsnixsuez</div>
        <a href="../index.html" class="footer-portfolio-link">← Back to Portfolio</a>
    </footer>

    <script>
        // Loader Logic
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 600);
            }, 1500); // 1.5s forced minimum loading delay for smooth effect
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/nixodesu/sw.js');
            });
        }
    </script>
</body>
</html>
